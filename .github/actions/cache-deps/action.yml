name : 'Get dependencies & Cache'
description: 'Get dependencies (npm ci) and cache them in main workflow'
inputs:
  caching:
    description: 'where the dependecies install or not' 
    required: false
    defualt: 'true'
outputs:
  used-cache:
    description: 'where cahe used or not'
    value: ${{steps.install.outputs.cache}}
runs:
  using: 'composite'
  steps:
    - name: Cache dependencies
      if: inputs.cahing == 'true'
      uses: actions/cache@v3
    - name: install dependencies
      id: install
      if: inputs.caching != 'true'
      run: |
        npm ci
        echo "cache=${{inputs.cahing}}" >> $GITHUB_OUTPUT
      shell: bash