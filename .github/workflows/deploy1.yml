name: Deployment Website workflow
on:
    push:
        branches:
            - master
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            - name: Get & build the cache
              id: cache-deps
              uses: ./.github/actions/cache-deps/
              with:
                caching: 'false'
            - name: Output Info
              run: echo "Cache used? = ${{steps.cache-deps.outputs.used-cache}}"
            - name: Lint code
              run: npm run lint
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3
            - name: Get & build the cache
              uses: ./.github/actions/cache-deps/
            - name: test code
              id: run-tests
              run: npm run test
            - name: upload test report
              if: failure() && steps.run-tests.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
                name: test-report
                path: test.json
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            - name: Get & build the cache
              uses: ./.github/actions/cache-deps/
            - name: Build website
              run: npm run build
            - name: upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name : dist-files
                path: dist
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/checkout@v3
            - name: Get Build artifacts
              uses: actions/download-artifact@v4
              with: 
                name: dist-files
                path: dist
            - name: Output contents
              run: ls
            - name: Deploy site
              run : echo "Deploying the Site!!!!"
            
